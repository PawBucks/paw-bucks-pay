  <head>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-transparent-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-transparent-16x16.png" />
    <link rel="shortcut icon" href="/favicon-transparent-32x32.png" />

    <meta name="theme-color" content="#3fbcd0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Primary Meta Tags -->
    <title>PawBucks - Local Pet Rewards &amp; Services Platform | The all-in-one ecosystem for pet owners, local pet services, and businesses</title>
    <meta name="title" content="PawBucks - Digital Pet Payment Platform | Earn Rewards on Pet Services" />
    <meta name="description" content="A local pet rewards and services platform connecting pet owners with trusted businesses while rewarding everyday pet spending.">
    <meta name="keywords" content="pet payments, pet wallet, PawBucks rewards, pet stores, groomers, pet services, digital wallet, pet expenses, pet owner rewards, pet care, dog grooming, cat supplies">
    <meta name="author" content="PawBucks" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://pawbucks.app/" />
    
    <!-- Additional SEO Meta Tags -->
    <meta name="language" content="English" />
    <meta name="revisit-after" content="3 days" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    <meta name="classification" content="Pet Services, Finance, Rewards" />
    <meta name="category" content="Pet Payment Platform" />
    <meta name="coverage" content="Worldwide" />
    <meta name="target" content="Pet Owners, Pet Merchants" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pawbucks.app/" />
    
    
    <meta property="og:image" content="https://pawbucks.app/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PawBucks - Digital Pet Payment Platform" />
    <meta property="og:site_name" content="PawBucks" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pawbucks.app/" />
    
    
    <meta name="twitter:image" content="https://pawbucks.app/logo.png" />
    <meta name="twitter:image:alt" content="PawBucks - Digital Pet Payment Platform" />
    <meta name="twitter:site" content="@PawBucks" />
    <meta name="twitter:creator" content="@PawBucks" />

    <!-- Mobile Optimization -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    
    <!-- Performance & Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://yxpnkipcoxksmnsvpvwi.supabase.co" />
    <link rel="preconnect" href="https://yxpnkipcoxksmnsvpvwi.supabase.co" crossorigin />
    
    <!-- Premium Typography - using media=print with onload for non-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    
    <!-- Critical Resource Hints -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="prefetch" href="/dashboard" as="document" />
    <link rel="prefetch" href="/discover" as="document" />
    
    <!-- Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PawBucks",
      "url": "https://pawbucks.app",
      "logo": "https://pawbucks.app/logo.png",
      "description": "Digital payment platform for pet services with PawBucks rewards. Connect with trusted pet merchants and earn rewards on every purchase.",
      "foundingDate": "2024",
      "sameAs": [
        "https://twitter.com/PawBucks",
        "https://facebook.com/PawBucks",
        "https://instagram.com/PawBucks"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English"]
      }
    }
    </script>
    
    <!-- WebApplication Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PawBucks",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser, iOS, Android",
      "description": "Digital payment platform for pet services with PawBucks rewards. Earn up to 30x points with every transaction.",
      "url": "https://pawbucks.app",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free tier - Earn 10x PawBucks per dollar spent"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "1000",
        "bestRating": "5",
        "worstRating": "1"
      },
      "featureList": [
        "Digital Wallet for Pet Expenses",
        "Earn PawBucks Rewards",
        "Connect with Pet Merchants",
        "Track Pet Health Records",
        "Lost Pet Alerts",
        "Secure Payments"
      ]
    }
    </script>
    
    <!-- WebSite Structured Data with Search Action -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PawBucks",
      "url": "https://pawbucks.app",
      "description": "Digital payment platform for pet owners. Find pet merchants, earn rewards, and manage pet expenses.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pawbucks.app/discover?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- FAQ Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is PawBucks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PawBucks is a digital payment platform designed for pet owners. It allows you to connect with trusted pet stores, groomers, trainers, and other pet service providers while earning rewards on every purchase."
          }
        },
        {
          "@type": "Question",
          "name": "How do I earn PawBucks rewards?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You earn PawBucks on every purchase at partner merchants. Free users earn 10x PawBucks per dollar spent, PawPass members earn 20x, and PawPass+ members earn 30x. 1,000 PawBucks equals $1 in rewards value."
          }
        },
        {
          "@type": "Question",
          "name": "Is PawBucks free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! PawBucks offers a free tier where you can earn 10x PawBucks per dollar spent. Premium tiers (PawPass and PawPass+) are available for enhanced earning rates and additional features."
          }
        },
        {
          "@type": "Question",
          "name": "What merchants accept PawBucks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PawBucks partners with a wide variety of pet service providers including pet stores, groomers, trainers, veterinary clinics, boarding facilities, and more. Visit our Discover page to find merchants near you."
          }
        }
      ]
    }
    </script>
    
    <!-- SoftwareApplication Structured Data for App Stores -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PawBucks",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "1000"
      }
    }
    </script>
